<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9B6FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="coreGradient2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE3F1"/>
    </radialGradient>
  </defs>

  <g transform="translate(100,100)">
    <!-- 4 long rays -->
    <g id="ray-long">
      <path d="M 0,0 C 14,-12 15,-40 0,-82 C -15,-40 -14,-12 0,0 Z" fill="url(#rayGradient)"/>
    </g>
    <use href="#ray-long" transform="rotate(0)"/>
    <use href="#ray-long" transform="rotate(90)"/>
    <use href="#ray-long" transform="rotate(180)"/>
    <use href="#ray-long" transform="rotate(270)"/>

    <!-- 4 short rays, offset 45deg -->
    <g id="ray-short">
      <path d="M 0,0 C 9,-8 10,-24 0,-52 C -10,-24 -9,-8 0,0 Z" fill="url(#rayGradient)" opacity="0.85"/>
    </g>
    <use href="#ray-short" transform="rotate(45)"/>
    <use href="#ray-short" transform="rotate(135)"/>
    <use href="#ray-short" transform="rotate(225)"/>
    <use href="#ray-short" transform="rotate(315)"/>

    <!-- glowing core -->
    <circle cx="0" cy="0" r="19" fill="url(#coreGradient2)"/>
  </g>
</svg>
